<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VISUAL TITLE</title>
<style>
/* Layout: one reading column. Diagrams, tables and code may run wider inside their own scroll box. */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --sunken: #eceef2; --line: #d8dce4;
  --ink: #17202b; --ink-2: #445063; --ink-3: #5f6b7d;
  --agent: #2351c9; --agent-soft: #e5ecfc; /* the agent's work, links */
  --you: #a64b08; --you-soft: #fcebd9;     /* where the user's attention is needed */
  --ok: #1b7548; --ok-soft: #e1f3e8;       /* recommended, holds, verified */
  --risk: #b3261e; --risk-soft: #fbe8e6;   /* risk, broken, not verified */
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Code", "Cascadia Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151c; --surface: #181f29; --sunken: #131921; --line: #2b3543;
    --ink: #e8edf4; --ink-2: #b7c1cf; --ink-3: #8b97a8;
    --agent: #86a8ff; --agent-soft: #1b2a4c;
    --you: #f2a766; --you-soft: #3b2814;
    --ok: #62cf99; --ok-soft: #14301f;
    --risk: #ff8f85; --risk-soft: #3d1815;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151c; --surface: #181f29; --sunken: #131921; --line: #2b3543;
  --ink: #e8edf4; --ink-2: #b7c1cf; --ink-3: #8b97a8;
  --agent: #86a8ff; --agent-soft: #1b2a4c;
  --you: #f2a766; --you-soft: #3b2814;
  --ok: #62cf99; --ok-soft: #14301f;
  --risk: #ff8f85; --risk-soft: #3d1815;
  color-scheme: dark;
}

/* Base */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); }
.page {
  max-width: 880px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 34px;
}
section, .stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
h1 { font: 650 27px/1.2 var(--display); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
h2 { font: 650 18.5px/1.3 var(--display); margin: 0; text-wrap: balance; }
h3 { font: 650 14.5px/1.35 var(--font); margin: 0; }
p { margin: 0; max-width: 68ch; }
ul, ol { margin: 0; padding-left: 1.25em; display: flex; flex-direction: column; gap: 5px; max-width: 68ch; }
a { color: var(--agent); }
strong { font-weight: 650; }
code { font: 0.88em var(--mono); background: var(--sunken); border: 1px solid var(--line); border-radius: 4px; padding: 0.08em 0.36em; overflow-wrap: anywhere; }
:focus-visible { outline: 2px solid var(--agent); outline-offset: 2px; }
.label { font: 600 12px/1.3 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.note { color: var(--ink-3); font-size: 13.5px; }

/* Header */
.top { display: flex; flex-direction: column; gap: 8px; }
.lede { font-size: 16.5px; color: var(--ink-2); max-width: 62ch; }

/* Needs you: the one thing the user has to decide or answer */
.ask { background: var(--you-soft); border: 1px solid color-mix(in srgb, var(--you) 40%, transparent); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.ask .label { color: var(--you); }

/* Chips */
.chip { display: inline-flex; align-items: center; font: 600 12px/1 var(--font); padding: 4px 9px; border-radius: 999px; background: var(--sunken); color: var(--ink-2); white-space: nowrap; }
.chip.you { background: var(--you-soft); color: var(--you); }
.chip.agent { background: var(--agent-soft); color: var(--agent); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.risk { background: var(--risk-soft); color: var(--risk); }

/* Panels side by side */
.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel.you .label { color: var(--you); }
.panel.agent .label { color: var(--agent); }
.files { list-style: none; padding: 0; gap: 7px; }
.files li { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.files span { color: var(--ink-2); font-size: 13.5px; }

/* Lanes: who does what, phase by phase. Children in order: three .head cells, then .phase, .you, .agent per row */
.lanes { display: grid; grid-template-columns: minmax(128px, 0.75fr) 1.25fr 1.5fr; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.lanes > * { padding: 12px 14px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); margin: -1px 0 0 -1px; min-width: 0; }
.lanes > .head { background: var(--sunken); font: 600 12px/1.3 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.lanes > .head.you { color: var(--you); background: var(--sunken); }
.lanes > .head.agent { color: var(--agent); }
.lanes > .phase { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
.lanes > .phase strong { font: 650 15px/1.3 var(--display); }
.lanes > .phase .say { color: var(--ink-2); font-size: 13.5px; }
.lanes > .you { background: color-mix(in srgb, var(--you-soft) 60%, var(--surface)); }
.lanes > .you.idle { background: var(--surface); color: var(--ink-3); }
@media (max-width: 600px) {
  .lanes { grid-template-columns: 1fr 1.2fr; }
  .lanes > .head.first { display: none; }
  .lanes > .phase { grid-column: 1 / -1; flex-direction: row; align-items: center; flex-wrap: wrap; gap: 8px; background: var(--sunken); padding-block: 8px; }
}

/* Options: a choice, side by side */
.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.option { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.option.pick { border-color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); }
.option header { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.option dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; font-size: 14px; }
.option dt { font-weight: 650; color: var(--ink-3); }
.option dd { margin: 0; min-width: 0; }
.brief { border: 1px dashed var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; }

/* Steps: what happens, in order */
.steps { list-style: none; padding: 0; gap: 0; counter-reset: step; max-width: none; }
.steps > li { counter-increment: step; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; padding-bottom: 16px; position: relative; }
.steps > li::before { content: counter(step); width: 28px; height: 28px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; font: 600 13px var(--mono); color: var(--ink-2); position: relative; z-index: 1; }
.steps > li:not(:last-child)::after { content: ""; position: absolute; left: 13.5px; top: 28px; bottom: 0; width: 1px; background: var(--line); }
.steps > li:last-child { padding-bottom: 0; }
.steps .body { display: flex; flex-direction: column; gap: 5px; padding-top: 3px; min-width: 0; }

/* Figures: diagrams and snippets */
figure { margin: 0; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
figcaption { font-size: 13px; color: var(--ink-3); max-width: 68ch; }
.diagram .scroll { overflow-x: auto; background: var(--sunken); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; }
.diagram svg { display: block; min-width: 560px; width: 100%; height: auto; color: var(--ink-3); font-family: var(--font); }
.diagram .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.25; }
.diagram .box-you { fill: var(--you-soft); stroke: var(--you); stroke-width: 1.25; }
.diagram .box-agent { fill: var(--agent-soft); stroke: var(--agent); stroke-width: 1.25; }
.diagram .box-ok { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.25; }
.diagram .box-risk { fill: var(--risk-soft); stroke: var(--risk); stroke-width: 1.25; }
.diagram .t { fill: var(--ink); font-size: 13px; font-weight: 650; }
.diagram .t2 { fill: var(--ink-2); font-size: 11px; }
.diagram .edge { stroke: currentColor; stroke-width: 1.5; fill: none; }
.diagram .edge-label { fill: var(--ink-2); font-size: 11px; }
.snippet pre { margin: 0; background: var(--sunken); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; overflow-x: auto; font: 13px/1.5 var(--mono); }
.snippet pre code { background: none; border: 0; padding: 0; font: inherit; overflow-wrap: normal; }
.snippet mark { background: var(--you-soft); color: inherit; border-radius: 3px; padding: 0 2px; }

/* Tables */
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; }
thead th { border-top: 0; background: var(--sunken); font: 600 12px/1.3 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }

/* Depth on demand */
details { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 16px; }
details > summary { cursor: pointer; padding: 11px 0; font-weight: 650; }
details[open] { padding-bottom: 14px; }
details > .stack { gap: 10px; }

/* Footer */
.foot { border-top: 1px solid var(--line); padding-top: 14px; color: var(--ink-3); font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
</style>
</head>

</body>
</html>
