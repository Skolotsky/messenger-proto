.napp{background:#111;color:#eee;margin:-18px -16px 12px;padding:16px;font-family:ui-monospace,Menlo,monospace}
.napp small{text-transform:uppercase;letter-spacing:.08em;color:#ffd479;font-size:11px}
.napp .sheet-note{color:#bbb}
.napp .switch{border:0;margin:0;padding:0;color:#eee}
.napp select{font:inherit;background:#222;color:#eee;border:1px solid #555;border-radius:4px;padding:2px 6px}
.rule>.av{flex:none}
/* context, long bursts, one-click open */
.ctx{opacity:.62;border-left:2px solid var(--line);padding-left:10px;margin:6px 0 0}
.ctx-l{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.ctx-l .link{text-transform:none;letter-spacing:0}
.more-new{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0;font-size:12.5px;color:var(--muted)}
.row-btns{display:flex;gap:4px}
.open-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);text-align:center;font-size:14px;line-height:1}
.open-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
/* row actions: one small joined toolbar, drawn icons */
.row-btns{gap:0;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.row-btns .mark-read,.row-btns .open-btn{width:32px;height:28px;border:0;border-radius:0;background:none;color:var(--muted);display:grid;place-items:center;opacity:1}
.row-btns .mark-read{border-right:1px solid var(--line)}
.row-btns .ic{width:17px;height:17px}
.row-btns button:hover{background:var(--accent-soft);color:var(--accent)}
@media (hover:hover) and (min-width:761px){.row-btns{opacity:0;transition:opacity .12s}.row-main:hover .row-btns,.row-btns:focus-within,.row.expanded .row-btns{opacity:1}}
@media (max-width:760px){.row-btns .mark-read,.row-btns .open-btn{width:38px;height:34px}}
/* react to any message */
.msg-self{position:relative}
.msg-tools{position:absolute;top:2px;right:0;z-index:3;display:flex;gap:0;border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.1);overflow:hidden}
.msg-tools .rx-btn,.msg-tools .rx-add{width:30px;height:26px;border:0;border-radius:0;background:none;font-size:14px;display:grid;place-items:center;color:var(--muted)}
.msg-tools .rx-add .ic{width:16px;height:16px}
.msg-tools button:hover{background:var(--accent-soft)}
button.rx{cursor:pointer}
button.rx:hover{border-color:var(--accent)}
.quick{align-items:center}
.quick small{font-size:12px;color:var(--muted);margin-right:4px}
@media (hover:hover) and (min-width:761px){.msg-tools{opacity:0}.msg-self:hover>.msg-tools,.msg-tools:focus-within{opacity:1}}
/* full emoji picker, and reacting from a collapsed row */
.picker{position:fixed;z-index:50;width:308px;max-height:360px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);color:var(--text)}
.pk-head{padding:10px 10px 8px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.pk-head small{color:var(--muted);font-size:12px}
.pk-head input{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel2);width:100%}
.pk-body{overflow-y:auto;padding:4px 8px 10px}
.pk-sec h4{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:8px 2px 4px}
.pk-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.pk-grid button{height:34px;border-radius:6px;font-size:20px;text-align:center}
.pk-grid button:hover,.pk-grid button:focus-visible{background:var(--accent-soft)}
.pk-none{color:var(--muted);font-size:13px;padding:12px 4px}
.msg-tools .rx-pick,.row-btns .rx-pick{width:30px;height:26px;display:grid;place-items:center;color:var(--muted);border-left:1px solid var(--line)}
.row-btns .rx-pick{width:32px;height:28px;border-left:0;border-right:1px solid var(--line)}
.msg-tools .ic,.rx-btn.rx-pick .ic{width:16px;height:16px}
.rx-btn.rx-pick{display:inline-grid;place-items:center;color:var(--muted)}
.rx-pick:hover{background:var(--accent-soft);color:var(--accent)}
@media (hover:none),(max-width:760px){.msg-tools .rx-btn{display:none}.msg-tools{border-color:transparent;background:none;box-shadow:none}.msg-tools .rx-pick{border:0;width:34px;height:30px}.row-btns .rx-pick{width:38px;height:34px}
  .picker{left:0 !important;right:0;top:auto !important;bottom:0;width:auto;max-height:62dvh;border-radius:16px 16px 0 0}.pk-grid button{height:42px;font-size:24px}}
/* reactions on their own line, buttons on the next */
.acts .quick{flex:0 0 100%;margin:0 0 2px}
.row.fresh{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.row.fresh .row-time::after{content:" · just in";color:var(--accent);font-weight:600}
/* arrivals: a bar that says what came in, and a button that brings it in */
.newpill{display:flex;align-items:center;gap:10px;padding:5px 5px 5px 14px;white-space:nowrap;max-width:calc(100% - 24px)}
.newpill span{display:flex;align-items:baseline;gap:8px;min-width:0;overflow:hidden}
.newpill small{font-weight:400;opacity:.85;overflow:hidden;text-overflow:ellipsis}
.newpill button{background:var(--on-accent);color:var(--accent);border-radius:99px;padding:4px 14px;font-weight:700;font-size:13px}
.newpill button:hover{opacity:.9}
/* arrivals bar beside the title */
.top .newpill{position:static;transform:none;box-shadow:none;flex:none;max-width:none;height:32px;padding:0 3px 0 12px;font-size:13px}
.top .newpill button{padding:3px 12px}
.top{min-height:60px}
/* phone: swipe layers */
.sw-under{display:none;position:absolute;inset:0;align-items:stretch}
.sw-l{flex:1;display:flex;align-items:center;gap:8px;padding:0 18px;background:var(--accent);color:var(--on-accent);font-weight:600}
.sw-r{display:flex}
.sw-r button{width:72px;display:grid;place-items:center;align-content:center;gap:3px;color:#fff;font-size:12px;font-weight:600}
.sw-r button:first-child{background:#3d5a80}.sw-r button:last-child{background:#9a5b13}
@media (max-width:760px){
  .row-btns,.row-chev{display:none}
  .sw-under{display:flex}
  .row-main{touch-action:pan-y;position:relative;z-index:1;background:var(--bg);transition:transform .16s}
  .row-main:hover{background:var(--bg)}
  .row.read .row-main{opacity:1}.row.read .row-main>*{opacity:.58}
  .row.kept.read .row-main>*,.hrow .row-main>*{opacity:1}
  .row.gone .row-main{background:var(--panel2)}
  .top .newpill small{display:none}
  .top .newpill{padding-left:12px;gap:8px}
}
@media (max-width:760px){.demo-btn{right:auto;left:0;top:auto;bottom:76px;border-radius:0 6px 6px 0;border:1px solid #666;border-left:0}}
@media (max-width:760px){.demo{bottom:122px}}
/* one settings screen */
.scrim.center{justify-content:center;align-items:center}
.sheet.settings{width:min(880px,94vw);height:min(660px,90vh);display:grid;grid-template-columns:210px 1fr;padding:0;border-radius:12px;overflow:hidden}
.set-nav{background:var(--panel2);padding:18px 8px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line)}
.set-nav h2{padding:0 10px 10px}
.set-item{padding:8px 10px;border-radius:6px;font-size:14.5px}
.set-item:hover{background:var(--hover)}
.set-item.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.set-body{padding:18px 22px 24px;overflow-y:auto}
.set-body>h2{margin-bottom:8px}
.set-body>h3:first-of-type{margin-top:6px}
/* the person's own menu in the sidebar */
.me{position:relative;border-top:1px solid var(--line);padding:8px}
.me-btn{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:8px}
.me-btn:hover{background:var(--hover)}
.me-btn>span:not(.av){display:flex;flex-direction:column;flex:1;min-width:0;line-height:1.2}
.me-btn>.av{flex:none;width:32px;height:32px}
.me-btn small{color:var(--muted);font-size:12px}
.me-pop{top:auto;bottom:calc(100% + 4px);left:8px;--panel:#fff;--text:#1c1d1f;--muted:#62666d;--line:#e3e3df;--hover:#f1f1ee;color:#1c1d1f}
.act-close{font-size:22px}
@media (max-width:760px){
  .sheet.settings{width:100%;height:100dvh;max-height:none;border-radius:0;grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .set-nav{flex-direction:row;overflow-x:auto;padding:12px 8px 8px;border-right:0;border-bottom:1px solid var(--line);align-items:center}
  .set-nav h2{padding:0 8px 0 4px;font-size:16px}
  .set-item{white-space:nowrap}
  .act-close{display:none}
}
/* phone: a visible react button on every row; mark read and open are the swipe and the tap */
@media (max-width:760px){
  .row-btns{display:flex;border:0;background:none;box-shadow:none}
  .row-btns .mark-read,.row-btns .open-btn{display:none}
  .row-btns .rx-pick{width:36px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
}
.gone-rule>span b{color:var(--muted)}
.sw-k{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 18px;background:#9a5b13;color:#fff;font-weight:600}
/* settings: notifications as one question, channels as a list changed in place */
.set-q{font-size:16px;font-weight:600;margin:4px 0 10px}
.n-group{display:grid;gap:8px}
.n-opt{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel)}
.n-opt:hover{border-color:var(--muted)}
.n-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.n-radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:2px}
.n-opt.on .n-radio{border-color:var(--accent);box-shadow:inset 0 0 0 3.5px var(--panel);background:var(--accent)}
.n-text{flex:1;display:flex;flex-direction:column;min-width:0}
.n-text small{color:var(--muted);font-size:13px}
.n-opt em{font-style:normal;font-size:12.5px;color:var(--muted);white-space:nowrap;margin-top:2px}
.set-list{margin:4px 0 0;padding-left:18px;font-size:14px;color:var(--text);display:grid;gap:4px}
.lv-legend{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;padding:10px 12px;background:var(--panel2);border-radius:8px;margin:8px 0 4px;font-size:13px}
.lv-legend div{display:flex;flex-direction:column}
.lv-legend span{color:var(--muted)}
.ch-row{padding:7px 0}
.ch-row select{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);min-width:128px}
@media (max-width:760px){.lv-legend{grid-template-columns:1fr}.n-opt em{display:none}}
/* activity feed settings: general rules on the page, lists on their own pages */
.set-item.sub{padding-left:26px;font-size:13.5px;color:var(--muted)}
.set-item.sub.on{color:var(--on-accent)}
.set-item.parent{font-weight:600}
.set-sw{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}

.set-sw span{display:flex;flex-direction:column}
.set-sw small{color:var(--muted);font-size:13px}
.set-link{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.set-link:hover{background:var(--hover)}
.set-link span{flex:1;display:flex;flex-direction:column}
.set-link small{color:var(--muted);font-size:13px}
.set-link .ic{transform:rotate(-90deg);color:var(--muted)}
.set-back{display:inline-block;margin:-2px 0 6px}
/* threads the familiar way: a link under the message, the thread opens on its own */
.thread-link{display:flex;align-items:center;gap:6px;margin:2px 0 6px 46px;padding:4px 8px;border:1px solid transparent;border-radius:6px;font-size:13px;color:var(--accent)}
.thread-link:hover{border-color:var(--line);background:var(--panel)}
.thread-link small{color:var(--muted)}
.thread-link .tl-go{color:var(--muted);visibility:hidden}
.thread-link:hover .tl-go{visibility:visible}
.to-chan{font-size:12px}
/* rows have no opened state; the toolbar is React, Mark read, Keep */
.row-btns .keep-btn{width:32px;height:28px;border:0;background:none;color:var(--muted);display:grid;place-items:center}
.row-btns .mark-read{border-right:1px solid var(--line)}
.row-btns .mark-read:last-child{border-right:0}
@media (max-width:760px){.row-btns .keep-btn{display:none}}
/* writing: edit in place, ask before delete, send states, mention suggestions */
.msg-tools .own-tool{width:30px;height:26px;display:grid;place-items:center;color:var(--muted);border-left:1px solid var(--line)}
.msg-tools .own-tool:hover{background:var(--accent-soft);color:var(--accent)}
.edit{display:flex;gap:6px;margin:2px 0}
.edit input{flex:1;min-width:0;border:1.5px solid var(--accent);border-radius:6px;padding:6px 9px;background:var(--panel)}
.del-ask{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--flag);border-radius:6px;background:var(--flag-soft);font-size:13.5px}
.del-ask span{flex:1 1 220px}
.btn.danger{background:var(--flag);color:#fff;border-color:transparent;font-weight:600}
.send-state{font-size:12.5px;color:var(--muted);margin-top:2px}
.send-state.fail{color:var(--flag)}
.msg.is-failed .msg-body,.msg.is-pending .msg-body{opacity:.55}
.msg.is-failed>.msg-self{box-shadow:inset 3px 0 0 var(--flag)}
.composer{position:relative}
.mp{position:absolute;left:16px;right:16px;bottom:100%;z-index:6}
.mp-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;margin-bottom:4px}
.mp-box button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:6px}
.mp-box button:hover{background:var(--hover)}
.mp-box button.act{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.mp-box small{color:var(--muted);font-size:12.5px}
/* when things go wrong: say so in a place that moves nothing */
.netpill{flex:none;background:var(--flag-soft);color:var(--flag);border:1px solid var(--flag);border-radius:99px;padding:3px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
.net-line{color:#ffb4ab !important;font-weight:600}
.sr-h{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;padding:6px 8px;font-size:13px}
.sr-h .lag{color:var(--flag);font-size:12.5px}
.sr-f{font-size:12px;color:var(--muted);padding:6px 8px 4px;border-top:1px solid var(--line);margin-top:4px}
mark{background:color-mix(in srgb,var(--focus) 30%,transparent);color:inherit;border-radius:2px;padding:0 1px}
.demo h2{margin-top:6px}
/* resize handles */
.rz{position:absolute;top:0;bottom:0;right:-4px;width:8px;cursor:col-resize;z-index:15}
.rz::after{content:"";position:absolute;top:0;bottom:0;left:3px;width:2px;background:transparent;transition:background .12s}
.rz:hover::after,body.resizing .rz::after{background:var(--accent)}
body.resizing{cursor:col-resize;user-select:none}
@media (max-width:760px){.rz{display:none}}
/* quiet scrollbars: thin, rounded, visible when the pointer is over the list */
*{scrollbar-width:thin;scrollbar-color:transparent transparent}
*:hover{scrollbar-color:color-mix(in srgb,var(--muted) 45%,transparent) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:transparent;border-radius:99px;border:3px solid transparent;background-clip:content-box}
*:hover>::-webkit-scrollbar-thumb,*:hover::-webkit-scrollbar-thumb{background-color:color-mix(in srgb,var(--muted) 45%,transparent)}
::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb,var(--muted) 70%,transparent)}
/* the message box: one box, field on top, levels and Send on a bar inside */

.msg-body,.row-preview{white-space:pre-wrap}
