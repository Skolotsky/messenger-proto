<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-002 notification app (mock-up)</title>
<!-- A mock-up of the separate notification app (D-022): what the notification sender delivered to one person. Outside the product. -->
<style>
:root{--bg:#e9e7e1;--panel:#fff;--text:#1c1d1f;--muted:#62666d;--line:#dddcd6;--accent:#0f6e64;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#101112;--panel:#1d1f22;--text:#e9e9e6;--muted:#a0a4ab;--line:#33363b;--accent:#4fc3b3;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:start center;padding:20px 12px;font:15px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.wrap{width:min(400px,100%)}.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tag{font:600 11px ui-monospace,Menlo,monospace;background:#111;color:#ffd479;padding:3px 8px;border-radius:4px}
h1{font-size:17px;margin:0;flex:1 1 100%}select,a{font:inherit}select{padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--text)}a{color:var(--accent)}
.phone{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:16px 12px 20px;min-height:560px}
.bar{display:flex;justify-content:space-between;font:600 13px ui-monospace,Menlo,monospace;color:var(--muted);padding:0 10px 10px}
.n{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;background:color-mix(in srgb,var(--panel) 92%,var(--text))}
.n.read{opacity:.55}.n-h{display:flex;gap:8px;font-size:12px;color:var(--muted)}.n-h b{color:var(--text)}.n-h span{margin-left:auto}
.n p{margin:2px 0 0}.n em{color:var(--muted)}.b{font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;border:1px solid var(--line)}
.note{font-size:12.5px;color:var(--muted);margin:10px 4px 0}
a.btn{text-decoration:none;color:inherit;display:inline-block}
</style></head><body><div class="wrap">
<div class="top"><h1>Notification app</h1><span class="tag">OUTSIDE THE PRODUCT</span><label>Delivered to <select id="who"><option value="maya">Maya Okafor</option><option value="tomas">Tomás Rivera</option><option value="anna">Anna Lindqvist</option></select></label><a href="control-panel.html">Control panel</a></div>
<div class="phone"><div class="bar"><span>10:42</span><span id="count"></span></div><div id="list"></div></div>
<p class="note" id="note"></p></div>
<script>
const D={maya:{note:'Maya notifies for Focus and Needs you. One notification per conversation, none for For your information.',n:[
 ['Anna Lindqvist','Direct message','Focus','10:41','Call me if 3 pm does not work. Otherwise see you there. <em>(10 messages, one notification)</em>',0],
 ['Priya Nair','#product','Needs you','10:33','Blocked: the pricing page still shows the old Team plan. Who owns that?',0],
 ['Tomás Rivera','#engineering','Needs you','10:31','@Maya the export API can\'t ship both CSV and XLSX by Thursday. Which one matters for launch?',0],
 ['Jonas Weber','#sales','Needs you','10:27','<em>Message deleted</em>',0],
 ['Deployer','#releases','Focus','10:21','2.0.0-rc3 is built and all 340 tests pass. I need your approval to release it to the 5% beta ring.',0],
 ['Marco Bianchi','#engineering','Needs you','10:16','Reacted ✅ to your message',0],
 ['Anna Lindqvist','#launch','Focus','09:12','@Maya I need your go/no-go on the Thursday date by end of day.',1]]},
 tomas:{note:'Tomás chose "Focus only", so mentions and replies wait in his feed without a notification.',n:[
 ['Marco Bianchi','Direct message','Focus','10:12','Can you look at the pool setting before you leave the incident?',0],
 ['Yuki Tanaka','#incidents','Focus','10:02','Checkout is slow on staging and prod. <em>(6 posts, one notification)</em>',1]]},
 anna:{note:'Anna notifies for Focus and Needs you.',n:[
 ['Maya Okafor','Direct message','Focus','Yesterday','Yes. Draft by Wednesday night.',1],
 ['Priya Nair','#launch','Needs you','Yesterday','Clinic Weekly, Practice Today and the Health Tech Letter.',1],
 ['Marco Bianchi','#launch','Needs you','09:14','Reacted 👀 to your message',0]]}};
function draw(){const d=D[document.getElementById('who').value];
 document.getElementById('list').innerHTML=d.n.map(x=>`<div class="n${x[5]?' read':''}"><div class="n-h"><b>${x[0]}</b>${x[1]} <i class="b">${x[2]}</i><span>${x[3]}</span></div><p>${x[4]}</p></div>`).join('');
 document.getElementById('count').textContent=d.n.filter(x=>!x[5]).length+' unread';document.getElementById('note').textContent=d.note+' An entry always shows the current state of its message: an edit shows the new text, a delete shows "Message deleted", and it is marked read when the row is read anywhere.';}
document.getElementById('who').addEventListener('change',draw);draw();
</script></body></html>
