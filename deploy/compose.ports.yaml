services:
  postgres:
    ports: ["127.0.0.1:15432:5432"]
  conversations:
    ports: ["127.0.0.1:18081:8080"]
  delivery:
    ports: ["127.0.0.1:18082:8080"]
  feed:
    ports: ["127.0.0.1:18083:8080"]
  search:
    ports: ["127.0.0.1:18084:8080"]
  sender:
    ports: ["127.0.0.1:18085:8080"]
  # `make up`: the demo program also serves the three pages and is the one address
  # people use, http://127.0.0.1:18080. It seeds the first organization by itself.
  demo:
    image: contexia-demo:dev
    build:
      context: ../server
      dockerfile: ../deploy/server.Dockerfile
      target: with-pages
      additional_contexts:
        webpages: ../web
    environment:
      CONTEXIA_WEB_DIR: /web
      CONTEXIA_DEMO_SEED_FIRST: "1"
    ports: ["127.0.0.1:18080:8080", "127.0.0.1:18086:8080"]
